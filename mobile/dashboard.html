<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미스터리 맨션 - 교사용 대시보드 (과정중심평가)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --text-light: #e0e0e0;
            --accent: #b38b59;
            --glass-bg: rgba(20, 20, 20, 0.8);
            --glass-border: rgba(179, 139, 89, 0.3);
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #ff5252;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Serif KR', serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 30px; }
        
        .dashboard-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--accent); padding-bottom: 20px; margin-bottom: 30px;
        }
        h1 { color: gold; font-family: 'Jua', sans-serif; font-size: 2.5rem; letter-spacing: 2px; }
        
        .controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .control-group { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 8px; border: 1px solid #333; }
        
        select, input, button {
            background: #1a1a1a; color: white; border: 1px solid var(--accent); padding: 8px 15px;
            border-radius: 5px; font-size: 1rem; cursor: pointer; transition: all 0.2s;
        }
        button:hover { background: var(--accent); color: #000; font-weight: bold; }
        button.danger { border-color: var(--danger); color: var(--danger); }
        button.danger:hover { background: var(--danger); color: white; }
        
        .stats-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 25px;
            border-radius: 12px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .stat-card h3 { color: #aaa; font-size: 1.1rem; margin-bottom: 10px; }
        .stat-card .value { color: gold; font-size: 2.5rem; font-weight: bold; font-family: 'Jua', sans-serif; }
        
        table { width: 100%; border-collapse: collapse; background: var(--glass-bg); border-radius: 10px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #333; }
        th { background: rgba(179, 139, 89, 0.2); color: gold; font-weight: bold; white-space: nowrap; }
        tr:hover { background: rgba(255,255,255,0.05); }
        
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .badge.A { background: rgba(76, 175, 80, 0.2); color: #4caf50; border: 1px solid #4caf50; }
        .badge.B { background: rgba(255, 152, 0, 0.2); color: #ff9800; border: 1px solid #ff9800; }
        .badge.C { background: rgba(255, 82, 82, 0.2); color: #ff5252; border: 1px solid #ff5252; }
        
        .progress-bar { width: 100%; background: #333; height: 8px; border-radius: 4px; margin-top: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), gold); transition: width 0.5s; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 12px; border: 1px solid var(--accent); width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 1.5rem; cursor: pointer; }
        .close-btn:hover { color: white; }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <h1>📊 주거단원 과정중심평가 대시보드</h1>
        <div class="controls">
            <div class="control-group">
                <label for="classFilter">반별 보기:</label>
                <select id="classFilter">
                    <option value="all">전체 반 보기</option>
                    <option value="1">1반</option>
                    <option value="2">2반</option>
                    <option value="3">3반</option>
                </select>
            </div>
            <button id="btnRefresh">🔄 새로고침</button>
            <button id="btnExportExcel" style="background-color: #2e7d32; border-color: #1b5e20;">📥 엑셀(CSV) 다운로드</button>
            <button id="btnResetAll" class="danger">⚠️ 전체 초기화</button>
        </div>
    </div>

    <div class="stats-cards">
        <div class="stat-card">
            <h3>총 참여 학생</h3>
            <div class="value" id="stat-total">0명</div>
        </div>
        <div class="stat-card">
            <h3>완수율 (마지막공간 도달)</h3>
            <div class="value" id="stat-completion">0%</div>
        </div>
        <div class="stat-card">
            <h3>성취도 A 수준 비율</h3>
            <div class="value" id="stat-level-a">0%</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>반</th>
                <th>번호</th>
                <th>이름</th>
                <th>진행도 (층수)</th>
                <th>성취수준</th>
                <th>최종 주거 유형</th>
                <th>설계한 집 이름</th>
                <th>상세 보기 / 관리</th>
            </tr>
        </thead>
        <tbody id="student-table-body">
            <!-- 데이터 렌더링 -->
        </tbody>
    </table>

    <!-- 상세 보기 모달 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title" style="color:gold;">학생 상세 리포트</h2>
                <button class="close-btn" id="closeModal">✖</button>
            </div>
            <div id="modal-body" style="line-height:1.6; color:#ddd;">
                <!-- 상세 내용 -->
            </div>
            <div style="margin-top:20px; text-align:right;">
                <button id="btnDeleteStudent" class="danger">이 학생 기록 삭제</button>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
