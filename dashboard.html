<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미스터리 맨션 - 교사용 대시보드 (과정중심평가)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --text-light: #f8fafc;
            --accent: #d4af37;
            --accent-hover: #fcd34d;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(212, 175, 55, 0.2);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Serif KR', serif; }
        body { 
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            color: var(--text-light); 
            padding: 40px; 
            min-height: 100vh;
        }
        
        .dashboard-header {
            display: flex; 
            flex-direction: column; 
            gap: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 25px; 
            margin-bottom: 35px;
        }
        h1 { 
            color: var(--accent); 
            font-family: 'Jua', sans-serif; 
            font-size: 2.8rem; 
            letter-spacing: 1px; 
            text-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            margin: 0;
        }
        
        .controls { 
            display: flex; gap: 15px; align-items: center; flex-wrap: wrap; 
            background: rgba(0,0,0,0.25);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .control-group { 
            display: flex; align-items: center; gap: 10px; 
            background: rgba(255,255,255,0.03); 
            padding: 8px 15px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.1); 
        }
        .control-group label {
            font-size: 0.95rem;
            color: #cbd5e1;
            font-weight: bold;
        }
        
        select, input, button {
            background: #1e293b; color: white; border: 1px solid var(--glass-border); padding: 10px 18px;
            border-radius: 8px; font-size: 0.95rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Noto Sans KR', sans-serif;
        }
        select:hover, input:hover { border-color: var(--accent); }
        select:focus, input:focus { outline: none; box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.3); }
        
        button { font-weight: bold; display: flex; align-items: center; gap: 6px; }
        button:hover { background: var(--accent); color: #000; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3); }
        button:active { transform: translateY(0); }
        button.danger { border-color: var(--danger); color: var(--danger); }
        button.danger:hover { background: var(--danger); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        
        .stats-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 15px 20px;
            border-radius: 12px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px); transition: transform 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .stat-card h3 { color: #94a3b8; font-size: 0.95rem; margin-bottom: 8px; font-weight: normal; }
        .stat-card .value { color: var(--accent); font-size: 2.2rem; font-weight: bold; font-family: 'Jua', sans-serif; text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2); }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--glass-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        th, td { padding: 18px 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(0,0,0,0.3); color: var(--accent); font-weight: bold; white-space: nowrap; font-size: 1.05rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.03); }
        
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; font-family: 'Noto Sans KR', sans-serif; }
        .badge.A { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.B { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge.C { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .progress-bar { width: 100%; background: rgba(0,0,0,0.5); height: 10px; border-radius: 5px; margin-top: 8px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #d4af37, #fde047); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 5px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid var(--accent); width: 90%; max-width: 650px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; margin-bottom: 25px; }
        .close-btn { background: none; border: none; color: #94a3b8; font-size: 1.8rem; cursor: pointer; padding: 0; }
        .close-btn:hover { color: white; background: none; transform: scale(1.1); box-shadow: none; }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <div class="dashboard-header">
        <h1>📊 주거단원 과정중심평가 대시보드</h1>
        <div class="controls">
            <div class="control-group">
                <label for="classFilter">반별 보기:</label>
                <select id="classFilter">
                    <option value="all">전체 반 보기</option>
                    <option value="1">1반</option>
                    <option value="2">2반</option>
                    <option value="3">3반</option>
                </select>
            </div>
            <div class="control-group">
                <label for="sortOrder">정렬:</label>
                <select id="sortOrder">
                    <option value="desc">최신 활동순 (위로)</option>
                    <option value="asc">과거 활동순</option>
                    <option value="num">반/번호순</option>
                </select>
            </div>
            <button id="btnToggleCharts" style="background-color: #5e35b1; border-color: #4527a0;">📊 통계 차트 보기</button>
            <button id="btnRefresh">🔄 새로고침</button>
            <button id="btnExportExcel" style="background-color: #2e7d32; border-color: #1b5e20;">📥 엑셀(CSV) 다운로드</button>
            <button id="btnResetAll" class="danger">⚠️ 전체 초기화</button>
        </div>
    </div>

    <div class="stats-cards">
        <div class="stat-card">
            <h3>총 참여 학생</h3>
            <div class="value" id="stat-total">0명</div>
        </div>
        <div class="stat-card">
            <h3>완수율 (마지막공간 도달)</h3>
            <div class="value" id="stat-completion">0%</div>
        </div>
        <div class="stat-card">
            <h3>성취도 A 수준 비율</h3>
            <div class="value" id="stat-level-a">0%</div>
        </div>
    </div>

    <!-- 📊 차트 영역 추가 (초기엔 숨김) -->
    <div id="chartsContainer" class="charts-container" style="display: none; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 30px;">
        <div class="chart-box" style="background: var(--glass-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--glass-border); box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
            <h3 style="text-align:center; color:#aaa; margin-bottom:15px;">🏆 성취 수준 분포</h3>
            <div style="position: relative; height:250px; width:100%; display:flex; justify-content:center;">
                <canvas id="levelChart"></canvas>
            </div>
        </div>
        <div class="chart-box" style="background: var(--glass-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--glass-border); box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
            <h3 style="text-align:center; color:#aaa; margin-bottom:15px;">🏠 선호 주거 유형 분포</h3>
            <div style="position: relative; height:250px; width:100%; display:flex; justify-content:center;">
                <canvas id="typeChart"></canvas>
            </div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>반</th>
                <th>번호</th>
                <th>이름</th>
                <th>진행도 (층수)</th>
                <th>성취수준</th>
                <th>최종 주거 유형</th>
                <th>설계한 집 이름</th>
                <th>상세 보기 / 관리</th>
            </tr>
        </thead>
        <tbody id="student-table-body">
            <!-- 데이터 렌더링 -->
        </tbody>
    </table>

    <!-- 상세 보기 모달 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title" style="color:gold;">학생 상세 리포트</h2>
                <button class="close-btn" id="closeModal">✖</button>
            </div>
            <div id="modal-body" style="line-height:1.6; color:#ddd;">
                <!-- 상세 내용 -->
            </div>
            <div style="margin-top:20px; text-align:right;">
                <button id="btnDeleteStudent" class="danger">이 학생 기록 삭제</button>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
